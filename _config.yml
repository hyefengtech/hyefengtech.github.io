# --- 기본 메타 ---
name: "인지니어스 기술블로그"
title: "인지니어스 기술블로그"
tagline: "상상력을 기술로, 이야기를 경험으로."
author: "Eclair"
description: "인문과 기술, 상상력이 만나는 곳. 월드플레이와 블랭크씬을 만들어가는 인지니어스의 기술블로그입니다. 콘텐츠와 IP의 새로운 가능성을 탐구하며, 기술적 고민과 실험, 개발 경험을 공유합니다."
avatar: "/images/avatar.png"
locale: ko_KR

footer-links:
  # github: "hyefengtech"   # 아이콘은 username만으로도 충분
  rss: true

disqus:
google_analytics:

navigation:
  - name: Categories
    url: /
  - name: About
    url: /about
  - name: DH Lab
    url: /dh/
  - name: Projects
    url: /projects/
  - name: Original IP
    url: /ip/
  - name: Archive
    url: /archive
  - name: Tags
    url: /tags
  - name: Search
    url: /search/

paginate: 5
paginate_path: "/page:num/"

url: "https://tech.worldplay.kr"
baseurl: ""
permalink: /:title/
timezone: Asia/Seoul
lang: ko

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :expanded

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# collections / defaults 기존 커스텀은 일단 비활성(꼬임 방지)
# 필요해지면 나중에 다시 킴
# collections: {}
# defaults: []

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - .idea

version: v1.2.0

