---
layout: default
---

<h1 style="
  margin: 8px 0 32px;
  color: #302e3c;
  font-size: clamp(30px, 5vw, 46px);
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -.045em;
">
  Tags
</h1>

{% assign tags = site.tags | sort %}
{% for tag in tags %}
<h2>{{ tag[0] }}</h2>
<ul>
  {% for post in tag[1] %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
{% endfor %}
