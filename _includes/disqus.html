
{% if site.disqus %}
<div class="comments creative-disqus">
  <div id="disqus_thread"></div>

  <script>
    var disqus_config = function () {
      this.page.url = {{ page.url | absolute_url | jsonify }};
      this.page.identifier = {{ page.url | jsonify }};
      this.page.title = {{ page.title | jsonify }};
    };

    (function () {
      var d = document;
      var s = d.createElement('script');

      s.src = 'https://{{ site.disqus }}.disqus.com/embed.js';
      s.setAttribute('data-timestamp', +new Date());
      s.async = true;

      (d.head || d.body).appendChild(s);
    })();
  </script>

  <noscript>
    댓글을 보려면 브라우저에서 JavaScript를 활성화해 주세요.
  </noscript>
</div>
{% endif %}
