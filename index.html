---
layout: default
---

<style>
/* 카테고리는 기존처럼 세로 목록으로 표시합니다. */
.site-category ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
.site-category li {
  margin: 0;
  border-bottom: 1px solid #e9edf2;
}
.site-category .category-link {
  display: block;
  padding: 0.9rem 0.25rem;
  color: inherit;
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  text-decoration: none;
  line-height: 1.5;
  transition: color .15s ease, padding-left .15s ease;
}
.site-category .category-link:hover,
.site-category .category-link:focus-visible {
  color: #2864a0;
  padding-left: .6rem;
  background: transparent;
  box-shadow: none;
  transform: none;
  text-decoration: none;
}
.site-category .category-link:focus-visible,
.site-category #random-post-btn:focus-visible {
  outline: 2px solid #729ed0;
  outline-offset: 2px;
}
.site-category .category-link.active {
  color: #2864a0;
  font-weight: 700;
}
.site-category #random-post-btn {
  margin: 1rem 0;
  padding: .55rem 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
  text-align: left;
}
.site-category #random-post-btn:hover {
  color: #2864a0;
  background: transparent;
}
@media (prefers-reduced-motion: reduce) {
  .site-category .category-link { transition: none; }
}
</style>

<header class="site-category">
  <ul style="list-style:none;">

    {% assign pages_list = site.pages %}
    {% for node in pages_list %}
      {% if node.title != null %}
        {% if node.layout == "category" %}
          <li><a class="category-link {% if page.url == node.url %} active{% endif %}"
          href="{{ site.baseurl }}{{ node.url }}">{{ node.title }}</a></li>
        {% endif %}
      {% endif %}
    {% endfor %}

  </ul>

  <button id="random-post-btn" style="margin:1rem 0;">🎲 랜덤 글</button>
  <script src="{{ '/random.js' | relative_url }}"></script>
  <script>
  document.getElementById('random-post-btn').addEventListener('click', function(){
    var url = randomPosts[Math.floor(Math.random()*randomPosts.length)];
    window.location.href = url;
  });
  </script>
</header>
